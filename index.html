<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ded7ca" />
    <title>VAJRA // Autonomous Counter-UAS Defense Simulator</title>
    <link rel="icon" type="image/png" href="/vajra-emblem.png" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #ded7ca;
      }
    </style>
    <script src="/registerSW.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Clear stale service worker caches on localhost to prevent stale UI lock-in
      if ('caches' in window && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        caches.keys().then((names) => {
          for (const name of names) {
            if (name.includes('local-assets') || name.includes('app-runtime') || name.includes('workbox-precache')) {
              caches.delete(name);
            }
          }
        });
      }
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
